
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}SwiftTrack{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; }
    nav { background: #1a1a2e; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
    nav a { color: white; text-decoration: none; font-size: 14px; }
    nav .brand { font-weight: bold; font-size: 18px; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .messages { margin-bottom: 16px; }
    .messages li { list-style: none; padding: 10px 14px; border-radius: 4px; margin-bottom: 6px; font-size: 14px; }
    .messages li.success { background: #d4edda; color: #155724; }
    .messages li.error   { background: #f8d7da; color: #721c24; }
    .messages li.info    { background: #d1ecf1; color: #0c5460; }
    footer { text-align: center; padding: 20px; font-size: 12px; color: #888; border-top: 1px solid #ddd; margin-top: 40px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <span class="brand"><a href="{% url 'home' %}" style="color:white;text-decoration:none">SwiftTrack</a></span>
  <a href="{% url 'tracking-search' %}">Track Shipment</a>
</nav>

<div class="container">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<footer>
  &copy; 2024 SwiftTrack. All rights reserved.
</footer>

{% block extra_js %}{% endblock %}
</body>
</html>
